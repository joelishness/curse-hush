# profanity-hush — pipeline configuration
# ============================================================================
# This file IS the default for every setting below -- there is no separate,
# hardcoded fallback anywhere in src/*.py any more. It's baked into the
# Docker image at build time (see Dockerfile), so even a container with no
# host config directory mounted at all runs on exactly what's written here.
# To change a default: edit this file and rebuild the image. Nothing in
# src/*.py needs to change. (A host-mounted config.yaml, if you use one --
# see hush.sh -c / docker-compose.yml's CONFIG_DIR -- only needs to specify
# the settings it wants to override; everything else still inherits from
# here. See utils.load_config() for the exact merge behaviour.)
#
# All settings here can also be overridden by environment variables (see
# bottom). For unattended overnight runs, the defaults in this file are
# already tuned for quality over speed. Processing a 2-hour film at the
# defaults takes roughly 3-4 hours on a 16 GB CPU machine (Steps 2+3
# combined); queue it before bed.
# ============================================================================


# ── Audio source separation (Step 2) ────────────────────────────────────────
demucs:

  # Model variant.
  #   htdemucs_ft  — Fine-tuned Hybrid Transformer v4, 4-stem.
  #                  Best overall quality; recommended default.
  #   htdemucs     — Hybrid Transformer v4, un-fine-tuned; slightly faster.
  #   htdemucs_6s  — 6-stem variant; may improve dialog isolation on dense
  #                  action-film mixes at the cost of significantly more
  #                  compute time.  See §11, open question 3.
  model: htdemucs_ft

  device: cpu

  # Random temporal shift averaging.
  # Higher values improve quality at proportional compute cost.
  #   1  — fast; good quality; recommended default for overnight runs
  #        Measured: ~1.09× realtime on a 16 GB machine (2-hour film → ~2.2 hrs)
  #   4  — improved quality; ~4× slower
  #        Estimated: ~4.4× realtime ≈ ~8.7 hrs for a 2-hour film (not yet
  #        directly measured — linear scaling from shifts=1 is unverified)
  #   10 — maximum quality; roughly 2.5× slower than shifts=4
  # Override with AC_SEGMENT_SIZE env var for the segment size (not shifts).
  shifts: 1


# ── Speech transcription (Step 3) ───────────────────────────────────────────
whisperx:

  # Whisper model size.
  #   large-v2  — recommended; best overall accuracy (default)
  #   large-v3  — newer but has known regression cases on some audio; use
  #               with caution
  #   medium    — faster, lower accuracy; acceptable for clean audio
  #   small     — for quick sanity-check runs only
  model: large-v2

  # ISO 639-1 language code.  Set to null for auto-detection.
  # Auto-detect adds a few seconds of startup overhead.
  language: en

  # Batch size for inference.  Lower than GPU default; tuned for CPU
  # memory pressure.  Reduce to 2 if you see OOM errors on low-RAM hosts.
  batch_size: 4

  # Beam search width.  Higher = more accurate transcription, slower.
  #   5  — good quality / speed tradeoff (default)
  #   10 — maximum quality
  beam_size: 5

  device: cpu

  # Numeric precision for inference.
  #   int8    — recommended for CPU: lower memory usage, faster inference
  #   float32 — fallback if int8 causes issues with a specific model build
  #   float16 — GPU only; ignored on CPU
  compute_type: int8


# ── Word-level alignment (Step 3, after WhisperX's own transcription pass) ──
alignment:

  # Which forced-alignment engine turns WhisperX's recognized text into
  # word-level start/end timestamps.
  #   mfa      — Montreal Forced Aligner (GMM-HMM via Kaldi). Default as of
  #              this version, after whisperx.align() was found to silently
  #              drift several seconds following a segment WhisperX's own
  #              transcribe() pass mis-timed internally (full case history
  #              in docs/timestamp-drift-investigation.md). MFA aligns the
  #              *entire* audio handed to it against the *entire* recognized
  #              text in one pass — it isn't scoped to WhisperX's internal
  #              ~30s decode chunks at all, so it can't inherit a
  #              chunk-boundary timing error the way whisperx.align() can.
  #              Validated directly against Independence Day (1996), not
  #              just reasoned about: of the 17 individually-confirmed
  #              drift cases from the original investigation, 14 landed
  #              correctly once MFA actually ran end-to-end; SRT-line
  #              coverage went from 90 fully-missed lines (whisperx) to 11
  #              (mfa) on the same film. See that doc for what's still
  #              unresolved — it's a WhisperX *recognition* gap on densely
  #              repetitive dialogue, not an alignment problem, and no
  #              alignment backend fixes it on its own.
  #              Requires the `montreal-forced-aligner` conda package (see
  #              Dockerfile) — NOT pip-installable; it depends on `kalpy`
  #              (compiled Kaldi bindings), which conda-forge ships as a
  #              prebuilt binary and PyPI does not carry at all.
  #   whisperx — wav2vec2 / CTC alignment via whisperx.align(). Falls back
  #              to this automatically per-segment if MFA fails and
  #              mfa.fallback_to_whisperx is true (default) — see below.
  #              Set backend to this directly only if you don't want the
  #              conda/MFA install at all and are fine with the drift
  #              behavior documented above.
  backend: mfa

  # Runs a numbered pipeline of alignment stages, not a fixed choice
  # between two named tools -- see steps/transcribe.py's _ALIGNMENT_STAGES
  # (the registry of stages this pipeline knows how to run; today
  # 1=WhisperX, 2=MFA) and steps/merge.py (which merges each stage's own
  # transcript_{N}_NN.json into transcript_{N}.json). `backend` above picks
  # which stage's result is AUTHORITATIVE for censoring (mfa -> stage 2,
  # cascading down to stage 1 for any segment stage 2 doesn't cover;
  # whisperx -> stage 1 only, even if a later stage also ran) -- see
  # transcribe.py's own docstring for the cascade rule. Stage numbers are
  # deliberately never tied to a specific tool's name in any filename this
  # pipeline writes, specifically so a future stage 3 (a different
  # aligner entirely) slots in without renaming anything already on disk;
  # job.json's own "alignment_stages" block is always the source of truth
  # for which tool a given number actually was on this job.
  #
  # Stage 1 always runs, for every segment, regardless of this setting --
  # it's the fallback source `backend: mfa` itself depends on, not
  # something optional. What this setting actually controls: whether
  # stage 2+ also run on segments where the authoritative stage (`backend`
  # above) doesn't already require them -- i.e. purely for
  # transcript_srt's (Step 6c) side-by-side comparison tracks. A stage
  # that fails for a given segment (or, for stage 2 specifically, one
  # that `backend` already knows failed as the authoritative attempt,
  # making a retry pointless) just has no data for that segment's span in
  # that stage's own transcript -- logged, never fatal, never a reason to
  # fail the segment or the run.
  # Roughly doubles this step's alignment time with today's two stages
  # (MFA is normally the slower of the two either way, so adding
  # WhisperX's own align() pass typically costs much less than doubling
  # in practice) -- defaulting to true FOR NOW, DURING DEVELOPMENT, while
  # actively troubleshooting alignment discrepancies; turn off once that
  # settles. Only takes effect for segments transcribed *after* this is
  # turned on -- like alignment.backend itself, changing this on an
  # existing job does not retroactively apply to Steps 1a-3b's
  # already-cached result (see pipeline.py's docstring on why those steps
  # aren't individually redoable).
  dual_output: true

  mfa:
    # Pretrained acoustic model + pronunciation dictionary name (as known to
    # `mfa model download`). english_mfa is trained on North American
    # English and is the model to reach for first for English-language film
    # dialogue.
    acoustic_model: english_mfa
    dictionary: english_mfa

    # G2P (grapheme-to-phoneme) model used to generate a pronunciation on
    # the fly for words the dictionary doesn't have an entry for, instead of
    # silently dropping them. Film dialogue leans heavily on contractions
    # and dropped-g colloquialisms ("sayin'", "outta", "gonna") that a
    # standard dictionary won't have every variant of — leave this set
    # rather than relying on the dictionary alone.
    g2p_model: english_us_mfa

    # Kaldi beam widths. 100/400 are MFA's own basic_align.yaml defaults --
    # not something picked arbitrarily here -- but its docs are explicit
    # that those defaults target utterances under 30 seconds, and that
    # longer sequences need both raised, giving 400/1000 as its own
    # example figure for "much longer sequences." Every segment this
    # pipeline hands to `align_one` is an entire ~30-*minute* dialog
    # segment treated as one utterance -- far past what 100/400 is tuned
    # for, and confirmed directly against a real run: segment 5 of
    # Independence Day failed with "Could not align the file with the
    # current beam size (100), please try increasing the beam size."
    # Widening trades alignment time for success rate (MFA's own
    # documentation: "the higher the beam value, the slower alignment
    # will be") -- if this value ever needs raising further, the error
    # message reports whatever beam size actually failed, so retry_beam
    # a few times that number is a reasonable next step, not a guess.
    beam: 400
    retry_beam: 1000

    # If MFA fails outright on a segment (model/dictionary missing, the
    # `mfa` binary not on PATH, a segment it can't align at all), fall back
    # to the whisperx.align() path for that segment rather than failing the
    # whole job. Logged clearly either way so a silent fallback is never
    # actually silent in the logs.
    fallback_to_whisperx: true


# ── Audio handling (Steps 1a / 1b) ──────────────────────────────────────────
audio:
  # v1: all source audio is downmixed to stereo (44.1 kHz, PCM 16-bit) for
  # processing.  The original audio track is preserved as-is in the job store
  # as a bitstream copy (audio_raw.{ext}), so future per-channel processing
  # (see §13.3) can re-run from Step 1b without touching the video again.

  # Maximum audio chunk sent to Demucs in one pass, in seconds.
  # Demucs loads the entire segment into RAM; reducing this is the primary
  # lever for keeping peak memory within budget on low-RAM machines.
  #   1800 — 30 minutes; recommended default (works within 16 GB)
  #   900  — 15 minutes; use if you see OOM on machines with < 16 GB RAM
  #   0    — disable segmentation (process the whole file at once — not
  #           recommended for feature-length films)
  # Override with AC_SEGMENT_SIZE env var (value in seconds).
  segment_size_sec: 1800


# ── SRT subtitle cross-reference (Step 4) ───────────────────────────────────
srt:

  # Use an SRT file if one is found alongside the input video, or if one is
  # explicitly provided on the command line.
  enabled: true

  # Conflict resolution strategy when WhisperX timing and SRT timing disagree.
  #   whisperx_primary  — trust WhisperX timestamps; use SRT only to confirm
  #                       word identity (default, recommended for v1)
  #   srt_primary       — trust SRT segment boundaries; override WhisperX timing
  #   highest_confidence — use whichever source has the higher confidence score
  strategy: whisperx_primary

  # Minimum fuzz-match score (0–100) to accept an SRT segment as a match
  # for a transcript word.  85 is a good starting point; lower if you find
  # too many missed matches, raise if you get false matches.
  fuzzy_threshold: 85


# ── Interactive review (Step 4b) ─────────────────────────────────────────────
interactive:

  # Set to true to enable the review prompt by default.
  # Can be overridden at runtime with --interactive / --no-interactive.
  enabled: false

  # Number of transcript words shown on each side of a flagged entry for
  # context.  Increase if you find the surrounding context too narrow to
  # make a confident approve/reject decision.
  show_context_words: 8

  # Confidence threshold for auto-approval. A flagged word is auto-approved
  # (never shown in the review prompt) only when its confidence is
  # STRICTLY GREATER than this value (see steps/review.py).
  #   0.0  — prompt for every flagged word regardless of confidence (default;
  #          special-cased to always prompt, rather than "score > 0.0", since
  #          nearly every real match would otherwise clear that bar)
  #   0.7  — auto-approve words with confidence > 0.7; prompt for the rest
  #   1.0  — NOT "auto-approve everything": confidence never exceeds 1.0, so
  #          nothing can ever be "> 1.0" -- this behaves the same as 0.0
  #          (prompt for every flagged word). There is no threshold value
  #          that skips review entirely; run without --interactive for that.
  # Use this to reduce review burden when most detections are high-confidence.
  # See §13.6 for the full Confidence-Guided Review roadmap item.
  min_confidence_for_prompt: 0.0


# ── Censoring behaviour (Step 5) ─────────────────────────────────────────────
censoring:

  # How to replace the flagged audio interval.
  #   mute  — replace with silence (default; clean, unambiguous)
  #   beep  — NOT YET IMPLEMENTED. Selecting this fails the run outright
  #           at Step 5 with a clear error, rather than silently doing
  #           nothing or falling back to mute -- see design doc §10,
  #           Phase 4, for the planned implementation.
  method: mute

  # Frequency of the beep tone in Hz.  Only used once method: beep is
  # implemented (see the note above) -- currently unused.
  # 1000 Hz is the classic broadcast censor tone.
  beep_frequency_hz: 1000

  # Padding added before and after each muted word, in milliseconds.
  # Prevents audible pops/clicks at edit boundaries.
  # 50 ms is a reasonable default; increase if clipping is audible,
  # decrease if adjacent words are accidentally muted.
  padding_ms: 50

  # Path to the word list file inside the container.
  # This should not need to change; word_list.txt lives in /config.
  word_list: /config/word_list.txt


# ── Output (Steps 6 / 7) ─────────────────────────────────────────────────────
output:

  # How to build the output filename.
  #   plex_edition — Plex-friendly {edition-Name} tag (default). See
  #                  edition_name below. Movies and TV episodes are
  #                  tagged at different points in the filename — see
  #                  steps/mux.py's _output_path() for the full reasoning
  #                  and the ellipsis-safe title/tech-tag boundary logic
  #                  it depends on:
  #                    "Movie (1986).sd.hevc.mkv" ->
  #                    "Movie (1986) {edition-Hushed}.sd.hevc.mkv"
  #                    "Psych (2006) - s02e01 - American Duos.sd.hevc.mkv" ->
  #                    "Psych (2006) - s02e01 - American Duos {edition-Hushed}.sd.hevc.mkv"
  #                  Falls back to appending the tag at the very end
  #                  (still valid Plex syntax — tag order doesn't matter
  #                  to Plex's parser) if neither pattern applies.
  #   suffix       — plain suffix appended before the extension; no Plex
  #                  Edition semantics, just a renamed file. See suffix
  #                  below.
  naming_style: plex_edition

  # Edition name used inside the {edition-...} tag.
  # Only used when naming_style: plex_edition.
  edition_name: Hushed

  # String appended to the input filename before the extension.
  # "movie.mkv" → "movie_censored.mkv"
  # Only used when naming_style: suffix.
  suffix: _censored

  # Output container format.
  #   mkv  — Matroska; recommended (flexible codec support, full subtitle/
  #          chapter/attachment passthrough, muxed with mkvmerge — see
  #          steps/mux.py for why mkvmerge rather than ffmpeg)
  #   mp4  — if you need a file that plays on more devices out of the box
  #          (muxed with ffmpeg; no subtitle/attachment passthrough)
  format: mkv

  # Whether to keep the large intermediate WAV/audio stems (audio_stereo.wav,
  # dialog.wav, score_sfx.wav, dialog_censored.wav, audio_censored.wav,
  # audio_encoded.mka) AND the per-segment transcript_NN.json files after a
  # successful run. Each is deleted by whichever step finishes consuming it
  # (Steps 3b, 5, 6, 6b, and 7 respectively) once it's no longer needed --
  # never by the step that produced it.
  # transcript.json (the merged file, not the per-segment transcript_NN.json
  # above), matches.json, review.json, and censor_log.json are ALWAYS kept
  # regardless of this setting -- they're needed for the correction workflow
  # (see keep_correction_artifacts below, and --skip-index / --add-interval /
  # --redo-review on the command line). transcript_NN.json is NOT one of
  # these: it's only ever read once, by Step 3b (merge), to build
  # transcript.json -- the correction workflow reads transcript.json, never
  # the per-segment files it came from.
  # Override with --keep-tmp on the command line or AC_KEEP_INTERMEDIATES=1.
  keep_intermediates: false

  # Whether to keep dialog.wav and score_sfx.wav specifically, independent
  # of keep_intermediates above. These two are what make a correction
  # cheap: re-running hush with --skip-index / --add-interval / --redo-review
  # only needs to redo Steps 5-7 (a few minutes) if they're still on disk --
  # without them, the same correction needs Step 2's Demucs separation all
  # over again (the most expensive step in the whole pipeline, often well
  # over an hour). Recommended to leave this at its default of true unless
  # disk space is tight and you're confident you won't need to correct
  # anything -- e.g. after watching the film once already on an earlier cut.
  keep_correction_artifacts: true

  # Log verbosity.  debug includes ffmpeg/demucs/whisperx subprocess output.
  # Timestamps on every log line use the host's local time (auto-detected by
  # hush.sh; see AC_TZ_OFFSET / AC_TZ_NAME below), falling back to clearly
  # labelled UTC if that wasn't forwarded. There's no config.yaml setting for
  # this -- it's host-environment information, not pipeline behaviour.
  log_level: info          # debug | info | warning


# ── Transcript SRT export (Step 6c) ─────────────────────────────────────────
transcript_srt:

  # Render each available alignment stage's transcript -- transcript_1.json,
  # transcript_2.json, ... (steps/merge.py; see alignment.dual_output and
  # steps/transcribe.py's _ALIGNMENT_STAGES for what produces which number)
  # -- plus transcript.json, the authoritative/censoring-relevant one,
  # regardless of which stage produced it for a given segment -- each into
  # its own SRT, saved next to the output video and/or in the job
  # directory. Built as a debugging aid: figuring out *why* a word got
  # muted at the wrong moment, or why two alignment stages disagree,
  # normally means cross-referencing the output video against a transcript
  # against the original audio by hand, across three separate tools (see
  # docs/timestamp-drift-investigation.md for exactly how tedious that is)
  # -- with this on, it's "turn a subtitle track on and watch," for any
  # stage independently, or for the final result.
  enabled: true

  # Also mux every available SRT into the final output video as an
  # additional subtitle track (steps/mux.py) -- on top of write_sidecar
  # below, not instead of it; the two aren't mutually exclusive. Defaults
  # to false FOR NOW, DURING DEVELOPMENT: a sidecar file is trivial to
  # delete or regenerate while grouping/karaoke settings are still being
  # tuned, where re-muxing the whole container is not. Revisit once
  # settled. Re-running with this newly turned on for a job whose Step 7
  # already completed will re-mux once to pick the tracks up (see
  # pipeline.py's Step-6c/7 migration check) -- and re-running it again
  # later, after these tracks already exist in the output, REPLACES them
  # rather than adding duplicates (matched by exact track name -- see
  # track_name_prefix below and steps/mux.py's module docstring).
  embed_in_output: false

  # Write each available SRT next to the final output video too, using
  # the same base name as the video plus a language and stage-number tag,
  # e.g. for "Movie {edition-Hushed}.1080p.hevc.mkv" once two alignment
  # stages have run:
  #   Movie {edition-Hushed}.1080p.hevc.eng.1.srt   (stage 1 -- WhisperX)
  #   Movie {edition-Hushed}.1080p.hevc.eng.2.srt   (stage 2 -- MFA)
  #   Movie {edition-Hushed}.1080p.hevc.eng.srt     (authoritative/final)
  # The .eng.<N>.srt tail mirrors Plex/Kodi's own external-subtitle
  # convention of "<basename>.<language>.<flag>.ext" (Plex's own documented
  # flags there are just forced/sdh/cc, so a stage number won't be
  # auto-recognized as anything special) -- keeping .eng. intact and
  # immediately before the stage number is what keeps this readable at a
  # glance and still gets picked up by "add subtitle file" style pickers in
  # any player, which is this setting's actual goal: telling every stage
  # apart by filename when selecting one manually, not automatic
  # language-track matching. Independent of, and always on top of, the
  # job-directory copy (transcript_1.srt, transcript_2.srt, ...,
  # transcript.srt), which is unconditional whenever a source is available
  # -- this setting only controls the extra copy placed next to the video
  # itself.
  write_sidecar: true

  # Karaoke-style highlighting: color the single word actually being
  # spoken at each instant, rather than only grouping words like a
  # traditional subtitle track. SRT has no native way to change a color
  # mid-cue (see steps/transcript_srt.py's module docstring for the full
  # "does SRT actually support this" answer) -- this works by emitting one
  # cue per *word* instead of per line, each spanning just that word's own
  # timing, re-stating the full line with only the current word wrapped in
  # <font color=karaoke_color>. Confirmed directly: this survives byte-
  # for-byte through mkvmerge into MKV (output.format: mkv, the default)
  # and renders correctly via libass (ffmpeg's `subtitles` burn-in filter,
  # mpv) and other SRT-capable players (VLC and others) pointed at any of
  # these SRTs directly (job directory or sidecar), regardless of
  # output.format. It does NOT survive output.format: mp4's embed
  # specifically -- confirmed directly that ffmpeg's mov_text (the only
  # way to put a text subtitle inside an MP4 container at all) strips
  # every styling tag outright -- so steps/mux.py embeds a plain,
  # one-cue-per-line rendering there instead, regardless of this setting.
  # Both the job-directory copies and any sidecar copies are unaffected
  # either way and still get the karaoke version when this is true -- this
  # limitation is specific to mp4's embedded tracks.
  # false: skip the karaoke rendering everywhere (job directory, sidecar,
  # and any embed) and only group words like a traditional subtitle track.
  karaoke: true

  # Color applied to the currently-spoken word when karaoke is true.
  # #RRGGBB hex. A bright, saturated color reads best against traditional
  # white/default subtitle text. Shared by every stage's SRT -- players
  # show at most one subtitle track at a time by default, so telling them
  # apart by filename/track name (see track_name_prefix below) matters far
  # more than giving each stage a different color would.
  karaoke_color: "#FFD400"

  # ── Grouping: how recognized words are bundled into subtitle lines ──────
  # A new group starts as soon as the next word would break ANY ONE of the
  # limits below -- the same kind of call a human subtitle editor makes
  # breaking a line at a natural pause, a sentence boundary, or once a
  # line is simply full. (One more rule applies unconditionally, with no
  # setting here: a word ending in '.', '?', or '!' always ends its group
  # -- see steps/transcript_srt.py's _SENTENCE_END_RE.) Applied
  # independently to each stage's own word list -- different alignment
  # stages' timing can differ enough that their SRTs end up grouped
  # slightly differently even for the same stretch of dialogue, which is
  # exactly the kind of discrepancy this feature exists to make visible.

  # Maximum words in one group before it's forced to break.
  max_words_per_group: 12

  # A pause at least this long (seconds) between two consecutive
  # recognized words forces a new group -- the same kind of real silence
  # docs/timestamp-drift-investigation.md's worked example discusses (a
  # shot change, a beat in the dialogue).
  max_group_gap_sec: 0.7

  # Maximum span, in seconds, from the group's first word's start to its
  # last word's end, before a new group is forced -- guards against a run
  # of short words with small gaps between each (individually under
  # max_group_gap_sec) still adding up to a group that lingers on screen
  # far longer than one subtitle line should.
  max_group_duration_sec: 7.0

  # Wrapping *within* a group's cue text, once the group itself is
  # decided. 42 characters and 2 lines are the same defaults broadcast
  # subtitle style guides (e.g. Netflix's) commonly use for English.
  max_chars_per_line: 42
  max_lines_per_group: 2

  # Embedded subtitle track metadata (steps/mux.py) -- the prefix for
  # what a player's subtitle track picker shows for each track. The full
  # name is built from this plus each stage's own label from job.json's
  # "alignment_stages" (see steps/transcribe.py) -- e.g.
  # "Hushed Transcript -- Stage 2 (MFA)" -- and "Hushed Transcript (Final)"
  # for the authoritative track, so a new stage 3 gets a sensible track
  # name automatically, with nothing here to update. This is also the
  # prefix steps/mux.py matches against to find and replace a track from a
  # previous run rather than adding a duplicate (see embed_in_output
  # above) -- change it and a previously-embedded track under the OLD
  # prefix is no longer recognized as "ours" on the next mux; it's left in
  # place rather than replaced, and only tracks under the new prefix get
  # added going forward.
  track_name_prefix: "Hushed Transcript"

  # ISO 639-2 (3-letter) language code for every embedded track and every
  # sidecar filename. Deliberately a raw string here rather than derived
  # from whisperx.language (ISO 639-1, 2-letter, and nullable for
  # auto-detect) -- there's no lookup table to keep in sync with that
  # setting. Set this directly if your content isn't English.
  track_language: eng


# ── Job storage ───────────────────────────────────────────────────────────────
storage:

  # Mount point for the jobs directory inside the container.
  # Maps to the host path set by --jobs (default: ~/.local/share/profanity-hush/jobs).
  # pipeline.py reads this value directly (cfg_get(cfg, "storage", "jobs_dir")),
  # so it is a real setting, not just documentation of a fixed convention --
  # but changing it here alone will not move where hush.sh / docker-compose.yml
  # actually mount the host directory. All three must agree, or the container
  # will be looking somewhere other than where the host volume is actually
  # mounted. Change this only if you're also updating hush.sh / docker-compose.yml
  # to mount to the same new path.
  jobs_dir: /jobs


# ── Environment variable overrides ───────────────────────────────────────────
# The following env vars, if set in the host environment before calling hush.sh,
# override the corresponding config.yaml values inside the container:
#
#   AC_LOG_LEVEL                  info | debug | warning
#   AC_KEEP_INTERMEDIATES         1  → keep large WAV stems after run
#   AC_KEEP_CORRECTION_ARTIFACTS  1  → keep dialog.wav/score_sfx.wav (default)
#                                  0  → also delete them (this one defaults to
#                                       true, so unlike the others above, only
#                                       explicitly turning it *off* has an effect)
#   AC_INTERACTIVE                1  → enable interactive review (same as --interactive)
#   AC_SEGMENT_SIZE                override audio.segment_size_sec (seconds); 0 = no segmentation
#   AC_TZ_OFFSET / AC_TZ_NAME      host UTC offset (e.g. "-0700") / cosmetic
#                                  abbreviation (e.g. "PDT") for log timestamps --
#                                  not a config.yaml setting, since this is
#                                  information about the host environment, not
#                                  pipeline behaviour. hush.sh sets both
#                                  automatically; falls back to UTC if absent.
#   AC_INPUT_HOST_DIR / AC_OUTPUT_HOST_DIR
#                                  host-side paths corresponding to /input and
#                                  /output inside the container, for logging
#                                  host-navigable paths in job.json and the
#                                  final summary. Same reasoning as AC_TZ_OFFSET
#                                  above -- not a config.yaml setting, since
#                                  it's host environment information rather
#                                  than pipeline behaviour, even though it
#                                  does end up folded into cfg (under
#                                  paths.input_host_dir/output_host_dir) rather
#                                  than read directly from os.environ the way
#                                  AC_TZ_OFFSET is. hush.sh and docker-compose.yml
#                                  both set these automatically; there is
#                                  ordinarily no reason to set them by hand.
#
# Examples:
#   AC_LOG_LEVEL=debug ./hush.sh movie.mkv
#   AC_SEGMENT_SIZE=900 ./hush.sh movie.mkv   # 15-min segments for low-RAM machines
